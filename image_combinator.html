
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Combiner</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #101010;
    color: #fff;
    min-height: 100vh;
    padding: 40px 20px;
}

.container {
    max-width: 1050px;
    margin: auto;
}

header {
    text-align: center;
    margin-bottom: 40px;
}

header h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

header p {
    color: #888;
    font-size: 14px;
}

.upload-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-bottom: 35px;
}

.upload-box {
    border: 2px dashed #444;
    border-radius: 12px;
    padding: 25px;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
    background: #191919;
}

.upload-box:hover,
.upload-box.dragover {
    border-color: #ffffff;
    background: #202820;
}

.upload-box h3 {
    margin-bottom: 8px;
    font-size: 16px;
}

.upload-box p {
    font-size: 12px;
    color: #888;
    margin-bottom: 15px;
}

.upload-box input {
    display: none;
}

.upload-box button {
    padding: 10px 20px;
    background: #ffffff;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    color: #000;
}

.upload-box img {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: contain;
    background: #080808;
    border-radius: 8px;
    margin-top: 15px;
    display: none;
}

.image-name {
    color: #ffffff;
    font-size: 12px;
    margin-top: 10px;
    word-break: break-all;
}

.preview-section {
    margin-top: 35px;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.section-title span {
    color: #888;
    font-size: 12px;
}

.preview {
    max-width: 650px;
    margin: auto;
    background: #191919;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 12px;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #000;
    border-radius: 5px;
}

.placeholder {
    aspect-ratio: 8 / 9;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
    text-align: center;
    font-size: 14px;
}

.actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 25px;
    flex-wrap: wrap;
}

.actions button {
    padding: 13px 25px;
    border-radius: 7px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: 0.2s;
}

.download-btn {
    background: #ffffff;
    color: #000;
}

.reset-btn {
    background: #292929;
    color: #fff;
    border: 1px solid #444 !important;
}

.actions button:hover {
    opacity: 0.8;
    transform: translateY(-2px);
}

.actions button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
}

.status {
    text-align: center;
    margin-top: 15px;
    font-size: 12px;
    color: #888;
}

@media(max-width: 650px) {
    body {
        padding: 25px 15px;
    }

    .upload-grid {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="container">

    <header>
        <h1>Image Combiner</h1>
        <p>Upload two images and combine them into one downloadable image.</p>
    </header>

    <!-- IMAGE UPLOADS -->

    <div class="upload-grid">

        <div class="upload-box" id="box1">
            <h3>01 — Top Image</h3>
            <p>Upload your first 16:9 image</p>

            <input type="file" id="file1" accept="image/*">

            <button onclick="document.getElementById('file1').click()">
                Choose Image
            </button>

            <img id="preview1" alt="Top image preview">
            <div class="image-name" id="name1"></div>
        </div>

        <div class="upload-box" id="box2">
            <h3>02 — Bottom Image</h3>
            <p>Upload your second 16:9 image</p>

            <input type="file" id="file2" accept="image/*">

            <button onclick="document.getElementById('file2').click()">
                Choose Image
            </button>

            <img id="preview2" alt="Bottom image preview">
            <div class="image-name" id="name2"></div>
        </div>

    </div>

    <!-- FINAL PREVIEW -->

    <div class="preview-section">

        <div class="section-title">
            <h3>Final Result</h3>
            <span>1920 × 2160 PX · PNG</span>
        </div>

        <div class="preview">

            <div class="placeholder" id="placeholder">
                Your combined image will appear here.
            </div>

            <canvas id="canvas" width="1920" height="2160"
                    style="display:none;"></canvas>

        </div>

    </div>

    <!-- ACTIONS -->

    <div class="actions">

        <button class="download-btn" id="downloadBtn" disabled>
            ↓ Download PNG
        </button>

        <button class="reset-btn" id="resetBtn">
            Reset All
        </button>

    </div>

    <div class="status" id="status">
        Upload both images to generate your result.
    </div>

</div>

<script>

// CANVAS CONFIGURATION

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const WIDTH = 1920;
const HEIGHT = 1080;

// IMAGE STORAGE

let topImage = null;
let bottomImage = null;

const file1 = document.getElementById("file1");
const file2 = document.getElementById("file2");


// LOAD IMAGE

function loadImage(file, position) {

    if (!file || !file.type.startsWith("image/")) {
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event) {

        const img = new Image();

        img.onload = function() {

            if (position === "top") {
                topImage = img;

                document.getElementById("preview1").src = img.src;
                document.getElementById("preview1").style.display = "block";

                document.getElementById("name1").textContent = file.name;
            }

            else {
                bottomImage = img;

                document.getElementById("preview2").src = img.src;
                document.getElementById("preview2").style.display = "block";

                document.getElementById("name2").textContent = file.name;
            }

            generateImage();

        };

        img.onerror = function() {
            alert("Could not load this image. Please try another file.");
        };

        img.src = event.target.result;

    };

    reader.onerror = function() {
        alert("Could not read this file.");
    };

    reader.readAsDataURL(file);
}


// FILE INPUT EVENTS

file1.addEventListener("change", function() {
    loadImage(this.files[0], "top");
});

file2.addEventListener("change", function() {
    loadImage(this.files[0], "bottom");
});


// DRAW IMAGE WITHOUT DISTORTION

function drawImageCover(img, x, y, width, height) {

    const imgRatio = img.width / img.height;
    const targetRatio = width / height;

    let sx, sy, sw, sh;

    if (imgRatio > targetRatio) {

        sh = img.height;
        sw = img.height * targetRatio;

        sx = (img.width - sw) / 2;
        sy = 0;

    } else {

        sw = img.width;
        sh = img.width / targetRatio;

        sx = 0;
        sy = (img.height - sh) / 2;

    }

    ctx.drawImage(
        img,
        sx, sy, sw, sh,
        x, y, width, height
    );

}


// GENERATE FINAL IMAGE

function generateImage() {

    if (!topImage || !bottomImage) {

        document.getElementById("downloadBtn").disabled = true;

        document.getElementById("status").textContent =
            "Upload both images to generate your result.";

        return;
    }

    // Clear previous canvas

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw top image

    drawImageCover(
        topImage,
        0,
        0,
        WIDTH,
        HEIGHT
    );

    // Draw bottom image

    drawImageCover(
        bottomImage,
        0,
        HEIGHT,
        WIDTH,
        HEIGHT
    );

    // Show result

    canvas.style.display = "block";

    document.getElementById("placeholder").style.display = "none";

    document.getElementById("downloadBtn").disabled = false;

    document.getElementById("status").textContent =
        "Your combined image is ready to download.";

}


// DOWNLOAD PNG

document.getElementById("downloadBtn").addEventListener("click", function() {

    if (!topImage || !bottomImage) return;

    canvas.toBlob(function(blob) {

        if (!blob) {
            alert("Could not generate the PNG. Please try again.");
            return;
        }

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = url;
        link.download = "combined-image.png";

        document.body.appendChild(link);

        link.click();

        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);

    }, "image/png");

});


// RESET EVERYTHING

document.getElementById("resetBtn").addEventListener("click", function() {

    topImage = null;
    bottomImage = null;

    file1.value = "";
    file2.value = "";

    document.getElementById("preview1").style.display = "none";
    document.getElementById("preview2").style.display = "none";

    document.getElementById("name1").textContent = "";
    document.getElementById("name2").textContent = "";

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    canvas.style.display = "none";

    document.getElementById("placeholder").style.display = "flex";

    document.getElementById("downloadBtn").disabled = true;

    document.getElementById("status").textContent =
        "Upload both images to generate your result.";

});


// DRAG AND DROP

function setupDragDrop(boxId, position) {

    const box = document.getElementById(boxId);

    box.addEventListener("dragover", function(e) {
        e.preventDefault();
        box.classList.add("dragover");
    });

    box.addEventListener("dragleave", function() {
        box.classList.remove("dragover");
    });

    box.addEventListener("drop", function(e) {

        e.preventDefault();

        box.classList.remove("dragover");

        const file = e.dataTransfer.files[0];

        if (file) {
            loadImage(file, position);
        }

    });

}

setupDragDrop("box1", "top");
setupDragDrop("box2", "bottom");

</script>

</body>
</html>
